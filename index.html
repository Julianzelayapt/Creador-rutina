<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>julianzelayapt</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&family=Montserrat:ital,wght@0,700..900;1,700..900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['Inter', 'sans-serif'],
            display: ['Montserrat', '"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            condensed: ['Montserrat', 'sans-serif'],
          },
          colors: {
            gymYellow: '#facc15',
            gymGold: '#eab308',
            darkBg: '#0c0e12',
            darkCard: '#181b22',
            darkCardHover: '#20242e',
          }
        }
      }
    }
  </script>
  <style>
    /* ── Tipografía Base del Sistema: INTER para legibilidad técnica y datos ── */
    body, input, textarea, select, button {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased !important;
      -moz-osx-font-smoothing: grayscale !important;
      text-rendering: optimizeLegibility !important;
    }

    body {
      font-feature-settings: 'cv02' 1, 'cv03' 1, 'cv04' 1, 'cv11' 1, 'tnum' 1;
      transition: background-color 0.3s ease, color 0.3s ease;
      background-color: #0c0e12 !important;
      color: #ffffff;
    }

    /* ── Tipografía Deportiva Gymshark / Explore: Montserrat / Plus Jakarta Sans para Títulos y Días ── */
    .font-display {
      font-family: 'Montserrat', 'Plus Jakarta Sans', sans-serif !important;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .font-condensed {
      font-family: 'Montserrat', sans-serif !important;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Números tabulares para pesas y cronómetros */
    .font-mono {
      font-family: 'Inter', sans-serif !important;
      font-variant-numeric: tabular-nums !important;
      font-feature-settings: 'tnum' 1 !important;
    }

    /* Fondo negro absoluto permanente */
    .dark body {
      background-color: #000000 !important;
      color: #ffffff;
    }

    .light body {
      background-color: #f0f2f5 !important;
      color: #1a1a1a;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 10px;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
